<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student LMS — Assessment</title>
    <meta name="description" content="Online assessment and learning management system." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="index.css" />
    <style>
        /* PDF Container hidden on screen */
        #pdf-container { display: none; flex-direction: column; align-items: center; background: #555; padding: 20px; }

        /* PDF question overrides — make the standard question-block compact for A4 pages */
        #pdf-container .question-block {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
            font-size: 11px;
            margin-bottom: 6px;
            padding-bottom: 6px;
            break-inside: avoid;
        }
        #pdf-container .q-render-content { overflow: hidden; clear: both; }
        #pdf-container .qr-options-container { gap: 4px 12px; padding-left: 20px; }
        #pdf-container .qr-option-item { font-size: 11px; padding: 2px 6px; }
        #pdf-container .q-result-badge { margin-left: 20px; font-size: 10px; }
        #pdf-container .question-diagram img { max-width: 180px; }

        /* Print overrides */
        @media print {
            body { padding: 0 !important; margin: 0 !important; background: #fff !important; display: block !important; }
            #welcome-screen, #app-header, #app-main, #app-footer { display: none !important; }
            #pdf-container {
                display: block !important;
                background: transparent !important;
                padding: 0 !important;
            }
            .a4-page {
                margin: 0 !important;
                box-shadow: none !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                position: relative;
            }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>

<body>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-card">
            <div class="welcome-header">
                <div class="paper-emblem"><img src="logo.svg" alt="Logo" /></div>
                <div class="paper-id-badge" id="paper-id-badge">—</div>
            </div>
            <div class="welcome-body">
                <h1 class="welcome-title" id="welcome-title">Loading…</h1>
                <h2 class="welcome-subject" id="welcome-subject"></h2>
                <div class="welcome-meta-grid">
                    <div class="meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        <div><span class="meta-label">Duration</span><span class="meta-value"
                                id="meta-duration">—</span></div>
                    </div>
                    <div class="meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                        </svg>
                        <div><span class="meta-label">Questions</span><span class="meta-value"
                                id="meta-questions">—</span></div>
                    </div>
                    <div class="meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z" />
                        </svg>
                        <div><span class="meta-label">Marking</span><span class="meta-value" id="meta-marking">+1 per
                                correct</span></div>
                    </div>
                </div>
                <div class="instructions-box">
                    <h3 class="instructions-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="16" x2="12" y2="12" />
                            <line x1="12" y1="8" x2="12.01" y2="8" />
                        </svg>
                        Instructions
                    </h3>
                    <ol class="instructions-list" id="instructions-list"></ol>
                </div>
            </div>
            <div class="welcome-footer">
                <button id="btn-start" class="btn-start" onclick="startPaper()">
                    <span>Start Activity</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
                <p class="welcome-hint" id="welcome-hint"></p>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header id="app-header" style="display:none;">
        <div class="header-inner">
            <div class="header-brand">
                <div class="brand-icon"><img src="logo.svg" alt="Logo" /></div>
                <div class="brand-text">
                    <h1>Student LMS</h1>
                    <span class="brand-sub">Online Learning & Assessment</span>
                </div>
            </div>
            <div class="header-timer-wrap">
                <div id="timer-badge">
                    <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    <span id="timer">00:00:00</span>
                </div>
            </div>
            <div class="header-meta">
                <span class="meta-pill" id="progress-pill">0 / 0 answered</span>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main id="app-main" style="display:none;">
        <div id="loading-state" class="loading-state">
            <div class="loader-ring"></div>
            <p>Loading questions…</p>
        </div>
        <div id="paper-container" class="paper-container" style="display:none;"></div>
        <div id="submit-area" class="submit-area" style="display:none;">
            <button id="btn-submit" class="btn-submit" onclick="submitPaper()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                Submit Activity
            </button>
        </div>
        <div id="score-summary" class="score-summary" style="display:none;">
            <div class="score-card">
                <h2>Your Score</h2>
                <div class="score-ring" id="score-ring">
                    <svg viewBox="0 0 120 120">
                        <circle class="ring-bg" cx="60" cy="60" r="52" />
                        <circle class="ring-fg" cx="60" cy="60" r="52" id="ring-fg" />
                    </svg>
                    <div class="score-number" id="score-number">0</div>
                </div>
                <p class="score-detail" id="score-detail"></p>
                <div class="score-actions">
                    <button id="btn-download-pdf" class="btn-download" onclick="downloadPDF()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Download Corrected Activity (PDF)
                    </button>
                    <button class="btn-download" onclick="backToDashboard()"
                        style="border-color:var(--green);color:var(--green);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        Back to Dashboard
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="pdf-container"></div>

    <footer id="app-footer">
        <p>© 2026 Student LMS · Built for students, with ❤️</p>
    </footer>

    <script src="shared.js?v=2"></script>
    <script src="data.js?v=2"></script>
    <script src="auth.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>

</html>
