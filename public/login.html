<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student LMS — Login</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4f8 0%, #e0e7f1 50%, #d5dce8 100%);
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: fadeIn .5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: #fff;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 60%, #7c3aed 100%);
      padding: 32px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23fff' fill-opacity='.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      position: relative;
      z-index: 1;
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      filter: brightness(0) invert(1);
    }

    .login-title {
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .login-subtitle {
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      font-weight: 500;
      position: relative;
      z-index: 1;
      margin-top: 4px;
    }

    .login-body {
      padding: 28px;
    }

    /* Role tabs */
    .role-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      overflow: hidden;
    }

    .role-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #f8fafc;
      color: var(--text-dim);
      transition: all .2s;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .role-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .role-tab:first-child {
      border-right: 1.5px solid var(--border);
    }

    .login-error {
      background: var(--red-bg);
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-error.show {
      display: flex;
    }

    .login-error svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 15px;
      border-radius: 999px;
    }

    .login-footer {
      text-align: center;
      padding: 0 28px 24px;
    }

    .login-footer p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .create-toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .create-toggle a {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .create-toggle a:hover { text-decoration: underline; }

    .create-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .create-section.show { display: block; }
    .create-section h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }
    .create-section .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .create-error {
      background: var(--red-bg);
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
    }
    .create-error.show { display: block; }

    .create-success {
      background: var(--green-bg);
      color: var(--green);
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
    }
    .create-success.show { display: block; }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 4px;
      transition: color .2s;
      display: flex;
      align-items: center;
    }
    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle.active { color: var(--accent); }
  </style>
</head>

<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><img src="logo.svg" alt="Logo" /></div>
        <div class="login-title">Student LMS</div>
        <div class="login-subtitle">Sign in to continue</div>
      </div>

      <div class="login-body">
        <div class="role-tabs">
          <button class="role-tab active" onclick="setRole('student')" id="tab-student">
            <svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Student
          </button>
          <button class="role-tab" onclick="setRole('admin')" id="tab-admin">
            <svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Admin
          </button>
        </div>

        <div class="login-error" id="login-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="15" y1="9" x2="9" y2="15" />
            <line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span id="error-text"></span>
        </div>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="Enter username" required
              autocomplete="username" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position:relative;">
              <input class="form-input" type="password" id="password" placeholder="Enter password" required
                autocomplete="current-password" style="padding-right:44px;" />
              <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('password', this)" tabindex="-1"
                title="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-login" id="btn-login">
            Sign In
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>

        <!-- Create Account toggle (student only) -->
        <div class="create-toggle" id="create-toggle">
          Don't have an account? <a onclick="toggleCreateAccount()">Create one</a>
        </div>

        <!-- Create Account section -->
        <div class="create-section" id="create-section">
          <h4>Create Account</h4>
          <div class="create-error" id="create-error"></div>
          <div class="create-success" id="create-success"></div>
          <form onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label" for="reg-username">Username</label>
              <input class="form-input" type="text" id="reg-username" placeholder="Choose a username" required minlength="3" />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-password">Password</label>
              <input class="form-input" type="password" id="reg-password" placeholder="Choose a password" required minlength="4" />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-whatsapp">WhatsApp Number</label>
              <input class="form-input" type="tel" id="reg-whatsapp" placeholder="e.g. +94 77 123 4567" />
              <div class="form-hint">Optional — helps your teacher contact you</div>
            </div>
            <button type="submit" class="btn btn-primary btn-login" style="background: linear-gradient(135deg, #16a34a, #059669);">
              Create Account & Sign In
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
              </svg>
            </button>
          </form>
          <div class="create-toggle" style="margin-top:12px;">
            Already have an account? <a onclick="toggleCreateAccount()">Sign in</a>
          </div>
        </div>
      </div>

      <div class="login-footer">
        <p>Enter your credentials to access the system.</p>
      </div>
    </div>
  </div>

  <script src="shared.js?v=2"></script>
  <script src="data.js?v=2"></script>
  <script src="auth.js?v=2"></script>
  <script>
    let selectedRole = 'student';

    // Seed DB on first visit
    DB.seed();

    // If already logged in, redirect
    if (Auth.isAdmin()) window.location.href = 'admin.html';
    else if (Auth.isStudent()) window.location.href = 'student.html';

    function setRole(role) {
      selectedRole = role;
      document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
      document.getElementById('tab-student').classList.toggle('active', role === 'student');
      document.getElementById('login-error').classList.remove('show');
      // Show/hide create account toggle
      document.getElementById('create-toggle').style.display = role === 'student' ? '' : 'none';
      if (role === 'admin') {
        document.getElementById('create-section').classList.remove('show');
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.title = 'Hide password';
        btn.classList.add('active');
      } else {
        input.type = 'password';
        btn.title = 'Show password';
        btn.classList.remove('active');
      }
    }

    function toggleCreateAccount() {
      document.getElementById('create-section').classList.toggle('show');
      document.getElementById('create-error').classList.remove('show');
      document.getElementById('create-success').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const result = await Auth.login(username, password);

      if (!result.success) {
        document.getElementById('error-text').textContent = result.error;
        document.getElementById('login-error').classList.add('show');
        return;
      }

      // Redirect based on actual role returned by server
      window.location.href = result.role === 'admin' ? 'admin.html' : 'student.html';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const whatsapp = document.getElementById('reg-whatsapp').value.trim();

      const errEl = document.getElementById('create-error');
      const sucEl = document.getElementById('create-success');
      errEl.classList.remove('show');
      sucEl.classList.remove('show');

      const result = await DB.registerGuest(username, password, whatsapp);

      if (!result.success) {
        errEl.textContent = result.error || 'Registration failed';
        errEl.classList.add('show');
        return;
      }

      // Auto-login: save session and redirect
      const session = {
        role: 'student',
        username: result.username,
        studentId: result.studentId,
        name: result.name,
        studentType: result.studentType || 'guest',
        token: result.token
      };
      sessionStorage.setItem('active_session', JSON.stringify(session));
      window.location.href = 'student.html';
    }
  </script>
</body>

</html>
